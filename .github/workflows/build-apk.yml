name: Build Configurable ARMv8 TTS Engine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make wget tar bzip2 unzip

      - name: Build native libraries for arm64-v8a
        run: |
          export ANDROID_NDK=$ANDROID_NDK_HOME
          ./build-android-arm64-v8a.sh

      - name: Prepare Assets
        run: |
          mkdir -p android/SherpaOnnxTtsEngine/app/src/main/assets/
          cd android/SherpaOnnxTtsEngine/app/src/main/assets/
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-en-v0_19.tar.bz2
          tar xf kokoro-en-v0_19.tar.bz2
          rm kokoro-en-v0_19.tar.bz2

      - name: Setup JNI Libs
        run: |
          mkdir -p android/SherpaOnnxTtsEngine/app/src/main/jniLibs/arm64-v8a/
          cp -v build-android-arm64-v8a/install/lib/*.so android/SherpaOnnxTtsEngine/app/src/main/jniLibs/arm64-v8a/

      - name: Fix Gradle Wrapper
        run: |
          cd android/SherpaOnnxTtsEngine
          # Ensure gradle-wrapper.jar is present or download it if needed
          # But we will rely on our commit for now.

      - name: Build APK
        run: |
          cd android/SherpaOnnxTtsEngine
          sed -i 's/2048/4096/g' gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find and Rename APK
        run: |
          find android/SherpaOnnxTtsEngine/app/build/outputs/apk/debug/ -name "*.apk" -exec mv {} sherpa-onnx-arm64-v8a-kokoro-configurable-debug.apk \;

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: sherpa-onnx-arm64-v8a-kokoro-configurable-debug.apk
          tag_name: latest-configurable
          name: Latest Configurable Build
          draft: false
          prerelease: false
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-tts-engine-debug-apk
          path: sherpa-onnx-arm64-v8a-kokoro-configurable-debug.apk
